name: 3-tier pipeline
on:
  push:
    branches:
      - main
    paths:
      - client/**
      - server/**
      - .github/workflows/cicd.yml

jobs:
  scan:
    name: gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run gitleaks
        run: |
          docker run --rm -v ${{ github.workspace }}:/code \
          zricethezav/gitleaks:latest detect \
          --source=/code --verbose \
          --report-format=json \
          --report-path=/code/gitleaks-report.json \
          --redact \
          --exit-code 0

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  checkov-terraform:
    name: Checkov Terraform scan
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov
        run: |
          checkov -d . \
          --quiet \
          --framework terraform \
          --output json \
          --output-file-path checkov-terraform-report.json \
          --soft-fail
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: checkov-terraform-report
          path: checkov-terraform-report.json

  checkov-docker:
    name: Checkov Docker scan
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov
        run: |
          checkov -d . \
          --quiet \
          --framework dockerfile \
          --output json \
          --output-file-path checkov-docker-report.json \
          --soft-fail
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: checkov-docker-report
          path: checkov-docker-report.json

  checkov-kubernetes:
    name: Checkov Kubernetes scan
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov
        run: |
          checkov -d . \
          --quiet \
          --framework kubernetes \
          --output json \
          --output-file-path checkov-k8s-report.json \
          --soft-fail
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: checkov-k8s-report
          path: checkov-k8s-report.json

  


        
