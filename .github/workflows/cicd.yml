name: 3-tier pipeline
on:
  push:
    branches:
      - main
    paths:
      - client/**
      - server/**
      - .github/workflows/cicd.yml

jobs:
  scan:
    name: gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run gitleaks
        run: |
          docker run --rm -v ${{ github.workspace }}:/code \
          zricethezav/gitleaks:latest detect \
          --source=/code --verbose \
          --report-format=json \
          --report-path=/code/gitleaks-report.json \
          --redact \
          --exit-code 0

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  checkov-terraform:
    name: Checkov Terraform scan
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov
        run: |
          checkov -d . \
          --quiet \
          --framework terraform \
          --output json \
          --output-file-path checkov-terraform-report.json \
          --soft-fail
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: checkov-terraform-report
          path: checkov-terraform-report.json

  checkov-docker:
    name: Checkov Docker scan
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov
        run: |
          checkov -d . \
          --quiet \
          --framework dockerfile \
          --output json \
          --output-file-path checkov-docker-report.json \
          --soft-fail
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: checkov-docker-report
          path: checkov-docker-report.json

  checkov-kubernetes:
    name: Checkov Kubernetes scan
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov
        run: |
          checkov -d . \
          --quiet \
          --framework kubernetes \
          --output json \
          --output-file-path checkov-k8s-report.json \
          --soft-fail
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: checkov-k8s-report
          path: checkov-k8s-report.json

  trivy-fs-scan-client:
    name: Trivy-FS-scan Client
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.74.0
          cache: true
      - name: Run Trivy-FS-scan Client
        run: |
          trivy fs ./client --quiet \
          --format table \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --output trivy-fs-client-report.txt \
          --exit-code 0
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: trivy-fs-client-report
          path: trivy-fs-client-report.txt

  trivy-fs-scan-server:
    name: Trivy-FS-scan Server
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.74.0
      - name: Run Trivy-FS-scan Server
        run: |
          trivy fs ./server --quiet \
          --format table \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --output trivy-fs-server-report.txt \
          --exit-code 0
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: trivy-fs-server-report
          path: trivy-fs-server-report.txt
  lint-client:
    name: Lint Client
    runs-on: ubuntu-latest
    needs:
      - scan
      - checkov-terraform
      - checkov-kubernetes
      - checkov-docker
      - trivy-fs-scan-client
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Install dependencies
        run: npm install
      - name: Run lint
        run: npm run lint
        continue-on-error: true
  lint-server:
    name: Lint Server
    runs-on: ubuntu-latest
    needs:
      - scan
      - checkov-terraform
      - checkov-kubernetes
      - checkov-docker
      - trivy-fs-scan-server
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Install dependencies
        run: npm install
      - name: Run lint
        run: npm run lint
        continue-on-error: true


  


        
